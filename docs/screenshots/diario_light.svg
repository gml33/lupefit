  <rect x="0" y="680" width="400" height="40" fill="#FFFFFF"/>
  <text x="40" y="706" font-family="system-ui" font-size="11" fill="#006C4C" text-anchor="middle">🏠</text>
  <text x="120" y="706" font-family="system-ui" font-size="11" fill="#404943" text-anchor="middle">📈</text>
  <circle cx="200" cy="692" r="24" fill="#006C4C"/>
  <text x="200" y="697" font-family="system-ui" font-size="16" fill="#FFFFFF" text-anchor="middle">+</text>
  <text x="280" y="706" font-family="system-ui" font-size="11" fill="#404943" text-anchor="middle">📋</text>
  <text x="360" y="706" font-family="system-ui" font-size="11" fill="#404943" text-anchor="middle">👤</text>
