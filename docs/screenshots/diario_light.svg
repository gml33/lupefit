  <text x="280" y="393" font-family="system-ui" font-size="11" fill="#404943" text-anchor="end">300g • 520 kcal</text>
  <rect x="40" y="412" width="160" height="32" rx="16" fill="#DBEAFE"/>
  <text x="120" y="433" font-family="system-ui" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">Ensalada verde</text>
  <text x="280" y="433" font-family="system-ui" font-size="11" fill="#404943" text-anchor="end">150g • 370 kcal</text>
  <!-- Merienda -->
  <rect x="16" y="448" width="368" height="100" fill="#FFFFFF" rx="24" stroke="#C4C7C3"/>
  <text x="40" y="476" font-family="system-ui" font-size="14" font-weight="600" fill="#7C3AED">🍪 Merienda</text>
  <text x="40" y="496" font-family="system-ui" font-size="13" fill="#404943">1 elemento • 180 kcal</text>
  <rect x="40" y="508" width="160" height="32" rx="16" fill="#EDE9FE"/>
