  <rect x="16" y="564" width="368" height="80" fill="#F5FBF6" rx="16"/>
  <text x="40" y="590" font-family="system-ui" font-size="13" font-weight="600" fill="#171D1A">Total del día</text>
  <text x="40" y="612" font-family="system-ui" font-size="24" font-weight="bold" fill="#171D1A">1.612 / 2.500 kcal</text>
  <rect x="40" y="620" width="280" height="6" rx="3" fill="#C4C7C3"/>
  <rect x="40" y="620" width="180" height="6" rx="3" fill="#006C4C"/>
  <text x="340" y="612" font-family="system-ui" font-size="12" fill="#404943">64%</text>
