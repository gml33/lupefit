  <rect x="40" y="296" width="160" height="32" rx="16" fill="#EDE9FE"/>
  <text x="120" y="317" font-family="system-ui" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">Huevos revueltos</text>
  <text x="280" y="317" font-family="system-ui" font-size="11" fill="#404943" text-anchor="end">100g • 172 kcal</text>
