  <circle cx="360" cy="56" r="20" fill="#006C4C"/>
  <text x="360" y="61" font-family="system-ui" font-size="16" fill="#FFFFFF" text-anchor="middle">+</text>
  <!-- Date picker -->
  <rect x="0" y="88" width="400" height="56" fill="#FFFFFF"/>
  <text x="40" y="118" font-family="system-ui" font-size="16" fill="#171D1A">◀  Miércoles, 20 nov  ▶</text>
  <text x="40" y="136" font-family="system-ui" font-size="13" fill="#404943">Desayuno • 542 kcal</text>
  <!-- Meal cards -->
  <rect x="16" y="156" width="368" height="140" fill="#FFFFFF" rx="24" stroke="#C4C7C3"/>
